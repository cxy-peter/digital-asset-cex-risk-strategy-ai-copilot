- scenario_id: BANK-PAY-ATO
  industry: banking
  business_line: 支付/账户
  event_stage: 登录与敏感操作
  risk_domain: account_security
  risk_types:
  - 账户接管
  - 撞库
  - SIM Swap
  definition: 攻击者取得账户控制权后发起支付或修改安全设置。
  attacker_profiles:
  - 撞库团伙
  - 社工团伙
  - 木马操作者
  black_grey_tools:
  - 撞库字典
  - 短信劫持
  - 钓鱼页
  - 远控木马
  - 代理IP
  attack_preferences:
  - 夜间操作
  - 新设备
  - 异地高速跳转
  - 先改密再绑卡
  manifestations:
  - 登录失败陡增
  - 新设备+新收款人
  - 短时大额支付
  data_sources:
  - 登录日志
  - 设备指纹
  - 支付订单
  - 安全设置日志
  candidate_features:
  - new_device_flag
  - failed_login_count_1h
  - geo_velocity_kmh
  - recent_password_change_flag
  expert_rules:
  - 新设备 AND 失败登录>=5 AND 敏感操作
  - 改密后2小时内新增收款人并大额支付
  recommended_models:
  - LogisticRegression
  - XGBoost
  - SequenceModel
  model_tradeoffs:
    LogisticRegression: 解释性强，适合审批和基线。
    XGBoost: 捕捉非线性组合，但需SHAP解释。
    SequenceModel: 适合操作序列，但数据和部署成本高。
  actions:
  - VIDEO_KYC
  - DELAY
  - TRANSACTION_RESTRICTION
  monitoring_metrics:
  - ATO识别率
  - 高风险拦截率
  - 误伤率
