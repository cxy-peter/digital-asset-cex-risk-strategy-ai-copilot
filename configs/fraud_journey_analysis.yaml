version: fraud_journey.v1
source_scope:
  primary_images: IMG_5668.JPG-IMG_5697.JPG
  expanded_notes: other_txt
objective:
  baseline: Q3 existing online strategies
  target: improve black-sample recall with governed online and offline controls
population:
  exclude_roles:
    - internal
    - market_maker
    - test
    - institution
    - large_customer_when_policy_requires
  exclude_silent_users: true
  white_sample_is_curated: true
  unlabelled_is_not_clean_negative: true
behavior_sequence:
  lookback_months: 4
  max_events_per_user: 200
  min_events_per_user: 10
  session_gap_minutes: 60
  require_user_event_origin_filter: true
feature_effectiveness:
  metrics:
    - coverage
    - missing_rate
    - binned_bad_rate
    - auc_1d
    - ks_1d
    - iv_woe
    - lift_at_operating_depth
    - psi
    - direction_consistency
  note: Source cutoffs are heuristics and require product-specific validation.
model_experiments:
  negative_to_positive_ratios: [null, 3, 4, 5]
  max_depth: [3, 4, 5, 6]
  probability_thresholds: [0.5, 0.6, 0.7, 0.8, 0.9]
  primary_business_preference: precision_first_with_minimum_recall_and_capacity_constraint
  selection_partition: development
  final_partition: chronological_oot_natural_distribution
governance:
  ai_role: propose_and_explain_only
  deterministic_role: calculate_metrics_rules_and_state
  human_role: approve_high_impact_action_and_regulatory_outcome
