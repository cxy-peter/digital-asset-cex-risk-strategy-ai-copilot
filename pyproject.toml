[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cointr-risk-strategy-ai-copilot"
version = "0.7.0"
description = "An internship-derived digital-asset Risk Strategy AI Copilot with specialist agents, MCP-style tools, deterministic backtesting, stability/conflict analysis, and company-style governance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pydantic>=2.8",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "networkx>=3.3",
  "xgboost>=2.1",
  "PyYAML>=6.0",
  "jinja2>=3.1",
  "plotly>=5.24",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "typer>=0.12",
  "rich>=13.8",
  "joblib>=1.4"
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.0"
]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
risk-copilot = "risk_copilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
